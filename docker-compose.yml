services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    restart: always
    environment:
      POSTGRES_DB: apex_db
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_password
    ports:
      - "5432:5432"
    volumes:
      - apex-postgres-data:/var/lib/postgresql/data

volumes:
  apex-postgres-data: