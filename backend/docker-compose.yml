services:
  postgres:
    image: postgres:16
    container_name: apex-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=apex_user
      - POSTGRES_DB=apex_db
      - POSTGRES_PASSWORD=password
    volumes:
      - apex-postgres-data:/var/lib/postgresql/data

volumes:
  apex-postgres-data:
