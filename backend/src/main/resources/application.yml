spring:
  application:
    name: apex-academy-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/apex_db?sslmode=disable
    username: apex_user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  paystack:
    secret-key: sk_test_your_secret_key_here
    base-url: https://api.paystack.co

